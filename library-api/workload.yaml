apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: library-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: library-managemen-5024a039
      envBindings:
        dbname: LIBRARY_DB_DBNAME
        host: LIBRARY_DB_HOST
        password: LIBRARY_DB_PASSWORD
        port: LIBRARY_DB_PORT
        user: LIBRARY_DB_USER
    - ref: library-managemen-122687ef
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
    - ref: library-managemen-6b22fba1
      envBindings:
        OPENLIBRARY_BASE_URL: OPENLIBRARY_BASE_URL
