apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: library-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - external

dependencies:
  endpoints:
    - component: library-management-keep-library-api
      name: http
      visibility: project
      envBindings:
        address: LIBRARY_API_URL
  resources:
    - ref: library-managemen-122687ef
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
