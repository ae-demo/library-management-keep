openapi: 3.0.3
info:
  title: Library API
  version: 0.1.0
  description: Shared book catalog with per-member read status and rating.
servers:
  - url: /
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    BookId:
      name: bookId
      in: path
      required: true
      description: book identifier
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Book:
      type: object
      required: [id, title, author, source]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        isbn: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        source: { type: string, enum: [lookup, manual], description: how the book was added }
        addedByMemberId: { type: string }
        averageRating: { type: number, nullable: true, description: average of all members' ratings }
        readCount: { type: integer, description: number of members who marked it read }
        createdAt: { type: string, format: date-time }
    NewBook:
      type: object
      required: [title, author, source]
      properties:
        title: { type: string }
        author: { type: string }
        isbn: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        source: { type: string, enum: [lookup, manual] }
    BookLookupResult:
      type: object
      required: [title, author]
      properties:
        title: { type: string }
        author: { type: string }
        isbn: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
    MemberBookStatus:
      type: object
      required: [bookId, memberId, read]
      properties:
        bookId: { type: string }
        memberId: { type: string }
        read: { type: boolean }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        updatedAt: { type: string, format: date-time }
    MemberBookStatusUpdate:
      type: object
      properties:
        read: { type: boolean }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
security:
  - bearerAuth: []
paths:
  /book-lookup:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: searchBookLookup
      summary: Search the external book database by title or ISBN
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: title or ISBN to search for
      responses:
        '200':
          description: candidate matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookLookupResult' }
        '400':
          description: missing or invalid query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /books:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listBooks
      summary: Browse/filter the shared catalog
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: title
          in: query
          schema: { type: string }
        - name: author
          in: query
          schema: { type: string }
        - name: read
          in: query
          description: filter by the caller's own read status
          schema: { type: boolean }
        - name: rating
          in: query
          description: filter by the caller's own rating
          schema: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: page of matching books
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createBook
      summary: Add a book to the shared catalog (via lookup match or manual entry)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBook' }
      responses:
        '201':
          description: book created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400':
          description: invalid book data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getBook
      summary: Get one book, with aggregate rating and read count
      responses:
        '200':
          description: the book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404':
          description: book not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteBook
      summary: Remove a book from the shared catalog
      responses:
        '204':
          description: book removed
        '404':
          description: book not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /books/{bookId}/status:
    parameters:
      - $ref: '#/components/parameters/BookId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getMyBookStatus
      summary: Get the caller's own read status and rating for a book
      responses:
        '200':
          description: the caller's status for this book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberBookStatus' }
        '404':
          description: book not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyBookStatus
      summary: Set the caller's own read status and/or rating for a book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberBookStatusUpdate' }
      responses:
        '200':
          description: updated status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberBookStatus' }
        '400':
          description: invalid status update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: book not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
